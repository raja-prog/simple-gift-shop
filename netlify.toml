[build]
  # Apply any pending Prisma migrations to the production DB, then build.
  # `migrate deploy` only runs migrations not yet recorded in the DB, so the
  # actual schema change executes once (first deploy after it's added) and is a
  # fast no-op on every deploy after that.
  command = "npx prisma migrate deploy && npm run build"
  publish = ".next"

# Official Next.js runtime for Netlify (SSR, ISR, API routes, on-demand revalidation)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

